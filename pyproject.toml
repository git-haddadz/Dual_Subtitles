[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-subtitles"
version = "0.1.0"
description = "Generate SRT and ASS dual-language subtitles from videos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dual Subtitles Maintainers" }]
dependencies = [
  "accelerate==1.14.0",
  "deep-translator==1.11.4",
  "huggingface_hub==1.24.0",
  "numpy==2.5.1",
  "pandas==3.0.3",
  "protobuf==7.35.1",
  "pydub==0.25.1",
  "pyannote.audio==4.0.7",
  "scipy==1.18.0",
  "sentencepiece==0.2.0",
  "soundfile==0.13.1",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchvision==0.23.0",
  "transformers==5.14.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
dual-subtitles = "dual_subtitles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "BLE",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "N",
  "PL",
  "PT",
  "RET",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "D100",
  "D104",
  "D203",
  "D213",
  "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004"]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = ".*\\.ipynb"

[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["*.ipynb"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
exclude = [".*\\.ipynb$", "build", "dist"]

[tool.pylint.main]
ignore-patterns = [".*\\.ipynb$"]
py-version = "3.11"
init-hook = "import sys; sys.path.insert(0, 'src')"

[tool.pylint.format]
max-line-length = 88

[tool.pylint.messages_control]
disable = [
  "broad-exception-caught",
  "import-error",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "import-outside-toplevel",
  "too-few-public-methods",
  "too-many-instance-attributes",
  "too-many-locals",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
